<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>單字翻轉卡 - 英語單字記憶學習</title>
    <meta name="description" content="互動式英語單字翻轉卡片，支援鍵盤無障礙與響應式排版學習。" />
    <link rel="icon" href="data:,">
    <!-- 預先連線以加快載入資源 -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- 載入 Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      :root {
        /* 色彩系統 (Color Tokens) */
        --color-primary: #1d4ed8;
        --color-primary-hover: #1e40af;
        --color-primary-subtle: #eff6ff;
        --color-primary-border: #bfdbfe;

        --color-bg-body: #f8fafc;
        --color-surface: #ffffff;
        --color-surface-dark: #0f172a;
        --color-border: #e2e8f0;
        --color-border-hover: #cbd5e1;

        --color-text-primary: #0f172a;
        --color-text-secondary: #334155;
        --color-text-muted: #64748b;
        --color-text-inverse: #ffffff;
        --color-text-inverse-subtle: #f1f5f9;

        --color-focus-ring: rgba(29, 78, 216, 0.4);

        /* 字體與字級 (Typography Tokens) */
        --font-base: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

        --font-size-xs: 0.75rem;
        --font-size-sm: 0.875rem;
        --font-size-base: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.35rem;
        --font-size-2xl: 1.65rem;

        --line-height-tight: 1.25;
        --line-height-normal: 1.5;
        --line-height-relaxed: 1.6;

        /* 間距 (Spacing Tokens) */
        --space-1: 0.25rem;  /* 4px */
        --space-2: 0.5rem;   /* 8px */
        --space-3: 0.75rem;  /* 12px */
        --space-4: 1rem;     /* 16px */
        --space-5: 1.25rem;  /* 20px */
        --space-6: 1.5rem;   /* 24px */

        /* 圓角 (Border Radius Tokens) */
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-full: 9999px;

        /* 陰影 (Shadow Tokens) */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-card: 0 2px 4px rgba(15, 23, 42, 0.06), 0 6px 12px -2px rgba(15, 23, 42, 0.08);
        --shadow-card-hover: 0 12px 24px -4px rgba(15, 23, 42, 0.12), 0 6px 10px -2px rgba(15, 23, 42, 0.06);

        /* 動態轉場 (Transition Tokens) */
        --transition-base: 0.2s ease;
        --transition-flip: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      body {
        font-family: var(--font-base);
        background-color: var(--color-bg-body);
        color: var(--color-text-primary);
        line-height: var(--line-height-normal);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* 頁首與頁尾樣式 */
      .app-header {
        background-color: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
      }

      .app-title {
        font-size: var(--font-size-2xl);
        font-weight: 700;
        color: var(--color-text-primary);
        letter-spacing: -0.01em;
      }

      .app-subtitle {
        font-size: var(--font-size-sm);
        color: var(--color-text-muted);
      }

      .instruction-alert {
        background-color: var(--color-primary-subtle);
        border: 1px solid var(--color-primary-border);
        color: var(--color-primary);
        border-radius: var(--radius-full);
        font-size: var(--font-size-sm);
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        max-width: 100%;
      }

      .instruction-alert kbd {
        background-color: var(--color-surface);
        color: var(--color-text-secondary);
        border: 1px solid var(--color-border);
        box-shadow: var(--shadow-sm);
        padding: 1px 6px;
        font-size: var(--font-size-xs);
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
      }

      main {
        flex: 1;
      }

      .app-footer {
        background-color: var(--color-surface);
        border-top: 1px solid var(--color-border);
        color: var(--color-text-muted);
        font-size: var(--font-size-xs);
      }

      /* 卡片網格與響應式排版 */
      .row.my-row {
        display: flex;
        flex-wrap: wrap;
        margin-left: -8px;
        margin-right: -8px;
      }

      /* 響應式卡片排列：手機 (390px) 單欄、平板 2-3 欄、桌面 (1280px) 5 欄 (4x5) */
      .col-custom {
        flex: 0 0 100%;
        max-width: 100%;
        padding: var(--space-2);
        box-sizing: border-box;
      }

      @media (min-width: 576px) {
        .col-custom {
          flex: 0 0 50%;
          max-width: 50%;
        }
      }

      @media (min-width: 768px) {
        .col-custom {
          flex: 0 0 33.333333%;
          max-width: 33.333333%;
        }
      }

      @media (min-width: 992px) {
        .col-custom {
          flex: 0 0 33.333333%;
          max-width: 33.333333%;
        }
      }

      @media (min-width: 1200px) {
        .col-custom {
          flex: 0 0 25%;
          max-width: 25%;
        }
      }

      /* 3D 視角容器 */
      .box {
        perspective: 1000px; /* 啟用 3D 視角 */
        height: 160px; /* 適合手機的卡片高度 */
        transition: transform var(--transition-base);
      }

      @media (min-width: 576px) {
        .box {
          height: 280px; /* 桌面端舒適卡片高度 */
        }
      }

      @media (hover: hover) and (pointer: fine) {
        .box:hover {
          transform: translateY(-4px);
        }
        .box:hover .card-inner {
          box-shadow: var(--shadow-card-hover);
          border-color: var(--color-border-hover);
        }
      }

      /* 翻轉卡片主體 */
      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 44px; /* 觸控目標標準 */
        transition: transform var(--transition-flip), box-shadow var(--transition-base);
        transform-style: preserve-3d;
        cursor: pointer;
        box-shadow: var(--shadow-card);
        border-radius: var(--radius-lg);
        transform-origin: center center;
        outline: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .card-inner.flipped {
        transform: rotateY(180deg);
      }

      /* 鍵盤焦點與無障礙互動狀態 */
      .card-inner:focus-visible {
        outline: 3px solid var(--color-primary);
        outline-offset: 3px;
        box-shadow: 0 0 0 4px var(--color-focus-ring), var(--shadow-card-hover);
      }

      .card-inner:active {
        transform: scale(0.98);
      }

      .card-inner.flipped:active {
        transform: rotateY(180deg) scale(0.98);
      }

      /* 卡片正反面共通樣式 */
      .front,
      .back {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: var(--space-2);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        text-align: center;
        box-sizing: border-box;
        word-break: break-word;
        overflow: hidden;
      }

      @media (min-width: 576px) {
        .front,
        .back {
          padding: var(--space-4);
        }
      }

      /* 卡片正面 */
      .front {
        background-color: var(--color-surface);
      }

      /* 卡片背面 */
      .back {
        transform: rotateY(180deg);
        background-color: var(--color-surface-dark); /* 深色基底，圖片載入前仍保有極高對比度 */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: var(--color-text-inverse);
      }

      /* 背面半透明漸層遮罩，確保各類背景圖上文字皆符合 WCAG AA 對比標準 */
      .back::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.72) 0%, rgba(15, 23, 42, 0.88) 100%);
        border-radius: inherit;
        z-index: 1;
      }

      .back > * {
        position: relative;
        z-index: 2;
      }

      /* 卡片頂部欄位：編號與翻轉提示 */
      .card-top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .word-id {
        display: inline-block;
        font-size: var(--font-size-xs);
        font-weight: 700;
        color: var(--color-text-muted);
        background-color: var(--color-bg-body);
        padding: 2px 8px;
        border-radius: var(--radius-full);
        border: 1px solid var(--color-border);
        letter-spacing: 0.05em;
        margin: 0;
      }

      .word-id-back {
        color: var(--color-text-inverse);
        background-color: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.28);
      }

      /* 發音按鈕 */
      .speaker-btn {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--font-size-lg);
        background-color: #eff6ff;
        border: 2px solid #bfdbfe;
        color: #1d4ed8;
        border-radius: var(--radius-full);
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        z-index: 10;
        transition: transform var(--transition-base), box-shadow var(--transition-base);
      }

      .speaker-btn:hover, .speaker-btn:focus-visible {
        transform: scale(1.1);
        box-shadow: var(--shadow-card);
        outline: none;
      }

      .speaker-btn:active {
        transform: scale(0.95);
      }

      /* 卡片主體內容區 */
      .card-main-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        width: 100%;
        padding: 0;
      }

      .word {
        font-size: var(--font-size-2xl);
        font-weight: 700;
        color: var(--color-text-primary);
        line-height: var(--line-height-tight);
        margin: 0 0 var(--space-1) 0;
      }

      .ipa {
        font-size: 1rem;
        color: #4B5563;
        font-weight: 500;
        margin: 0 0 var(--space-3) 0;
      }

      @media (min-width: 768px) {
        .word {
          font-size: 2.5rem;
        }
        .ipa {
          font-size: 1.25rem;
        }
      }

      .meaning-zh {
        font-size: var(--font-size-xl);
        font-weight: 700;
        color: var(--color-text-inverse);
        margin: 0 0 var(--space-3) 0;
        line-height: var(--line-height-tight);
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      }

      /* 例句容器 */
      .example-container {
        width: 100%;
        background-color: var(--color-bg-body);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: var(--space-2) var(--space-3);
        text-align: left;
      }

      .example-container-back {
        background-color: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .example-en {
        font-size: var(--font-size-sm);
        line-height: var(--line-height-normal);
        color: var(--color-text-secondary);
        margin: 0;
      }

      .example-zh {
        font-size: var(--font-size-sm);
        line-height: var(--line-height-normal);
        color: var(--color-text-inverse-subtle);
        margin: 0;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }

      .field-label {
        font-weight: 600;
        color: var(--color-text-primary);
      }

      .field-label-back {
        font-weight: 600;
        color: #ffffff;
      }

      /* 減少動態效果 (無障礙) */
      @media (prefers-reduced-motion: reduce) {
        .card-inner {
          transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .box {
          transition: none;
        }
        .box:hover {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <header class="app-header py-4 text-center">
      <div class="container">
        <h1 class="app-title mb-2">單字翻轉卡</h1>
        <p class="app-subtitle mb-3">互動式單字記憶卡片</p>
        <div class="instruction-alert alert alert-secondary text-center mb-0 px-3 py-2" role="status">
          <span aria-hidden="true">💡</span>
          <span>點擊卡片翻轉<span class="d-none d-md-inline">（支援鍵盤 <kbd>Tab</kbd> 與 <kbd>Enter</kbd> / <kbd>Space</kbd> 鍵操作）</span></span>
        </div>
      </div>
    </header>

    <main class="container py-4" id="main-content">
      <div class="row my-row" role="region" aria-label="單字卡清單">
        <!-- 卡片將在此動態生成 -->
      </div>
    </main>

    <footer class="app-footer py-4 text-center">
      <div class="container">
        <p class="mb-0">單字卡學習系統</p>
      </div>
    </footer>

    <!-- 載入 Bootstrap 5 JS -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"
      integrity="sha512-7Pi/otdlbbCR+LnW+F7PwFcSDJOuUJB3OxtEHbg4vSMvzvJjde4Po1v4BR9Gdc9aXNUNFVUY+SK51wWT8WF0Gg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- 載入 jQuery -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script src="./data/data.js"></script>
    <script>
      $(document).ready(function () {
        const myRow = $(".my-row");
        const gridSize = 20; // 4x5 = 20 個
        const wordData = typeof data !== "undefined" ? data : [];
        const limitedData = wordData.slice(0, gridSize); // 只取前 20 個

        // 預設的背景圖片陣列
        const backgroundImages = [
          "img/no1.png", // no.1
          "img/no2.png", // no.2
          "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 森林
          "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 海洋
          "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 星空
          "https://images.unsplash.com/photo-1501594907352-04cda38ebc29?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 沙漠
          "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 雪山 (已替換)
          "https://images.unsplash.com/photo-1509316785289-025f5b846b35?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 城市
          "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 重複使用
          "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 花田 (已替換)
          "https://images.unsplash.com/photo-1500829243541-74b677fecc30?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 田園
          "https://images.unsplash.com/photo-1480497490787-505ec076689f?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 瀑布
          "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 竹林 (已替換)
          "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 重複使用
          "https://images.unsplash.com/photo-1414609245224-afa02bfb3fda?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 櫻花
          "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 重複使用
          "https://images.unsplash.com/photo-1469474968028-56623f02e42e?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 草原
          "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 重複使用
          "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80", // 重複使用
          "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80"  // 重複使用
        ];

        limitedData.forEach(function (value, index) {
          let tmpText = `
                <div class="col-custom">
                    <div class="box">
                        <div class="card-inner" role="button" tabindex="0" aria-pressed="false" aria-label="單字卡：${value.word}，點擊翻轉查看意思">
                            <div class="front">
                                <div class="card-top-bar">
                                    <span class="word-id">No. ${value.id}</span>
                                </div>
                                <div class="card-main-content">
                                    <div class="d-flex align-items-center justify-content-center gap-3 mb-1">
                                        <h2 class="word mb-0" lang="en">${value.word}</h2>
                                        <div class="speaker-btn" role="button" aria-label="發音" tabindex="0">🔊</div>
                                    </div>
                                    <p class="ipa mb-0" lang="en">${value.ipa || "N/A"}</p>
                                </div>
                            </div>
                            <div class="back card-back-${index}">
                                <div class="card-top-bar">
                                    <span class="word-id word-id-back">No. ${value.id}</span>
                                </div>
                                <div class="card-main-content">
                                    <p class="meaning-zh" lang="zh-Hant">
                                        <span class="field-label-back">意思: </span>${value.meaning_zh || "N/A"}
                                    </p>
                                    <div class="example-container example-container-back">
                                        <p class="example-zh mb-1" lang="en">
                                            <span class="field-label-back">Example: </span>${value.example_en || "N/A"}
                                        </p>
                                        <p class="example-zh" lang="zh-Hant">
                                            <span class="field-label-back">例句: </span>${value.example_zh || "N/A"}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
          myRow.append(tmpText);
          
          // 為每張卡片設置不同的背景圖片
          $(`.card-back-${index}`).css('background-image', `url('${backgroundImages[index % backgroundImages.length]}')`);
        });

        // 翻轉卡片函式與無障礙狀態更新
        function toggleCard($card) {
          const isFlipped = $card.toggleClass("flipped").hasClass("flipped");
          $card.attr("aria-pressed", isFlipped ? "true" : "false");
          const word = $card.find(".word").text();
          if (isFlipped) {
            $card.attr("aria-label", `單字卡：${word}（已翻至背面），點擊翻回正面`);
          } else {
            $card.attr("aria-label", `單字卡：${word}，點擊翻轉查看意思`);
          }
        }

        // 綁定發音按鈕點擊與觸控事件，阻止冒泡以避免翻轉卡片
        myRow.on("click touchend", ".speaker-btn", function (e) {
          e.preventDefault();
          e.stopImmediatePropagation();
          // 在這裡處理發音邏輯 (例如呼叫 Web Speech API)
          console.log("Speaker button clicked/touched");
        });

        // 綁定發音按鈕鍵盤事件，阻止冒泡以避免翻轉卡片
        myRow.on("keydown", ".speaker-btn", function (e) {
          if (e.key === "Enter" || e.key === " " || e.keyCode === 13 || e.keyCode === 32) {
            e.preventDefault();
            e.stopImmediatePropagation();
            // 在這裡處理發音邏輯
            console.log("Speaker button activated via keyboard");
          }
        });

        // 綁定點擊事件：點擊卡片翻轉
        myRow.on("click", ".card-inner", function (e) {
          // 如果點擊的目標不是發音按鈕或其子元素，則翻轉
          if (!$(e.target).closest(".speaker-btn").length) {
            toggleCard($(this));
          }
        });

        // 綁定鍵盤事件：Enter 或 Space 鍵翻轉卡片
        myRow.on("keydown", ".card-inner", function (e) {
          // 如果按鍵觸發點不是發音按鈕，則翻轉
          if (!$(e.target).closest(".speaker-btn").length) {
            if (e.key === "Enter" || e.key === " " || e.keyCode === 13 || e.keyCode === 32) {
              e.preventDefault(); // 防止按 Space 時頁面向下滾動
              toggleCard($(this));
            }
          }
        });
      });
    </script>
  </body>
</html>
